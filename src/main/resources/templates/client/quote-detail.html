<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Cotización - REDCONFER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body class="bg-light">

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold"><span style="color:#C61A22;">RED</span>CONFER Portal</span>
            <div class="ms-auto">
                <a href="/cliente/dashboard" class="btn btn-outline-light btn-sm rounded-pill px-3">← Volver</a>
            </div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 800px;">
        <div class="card-premium p-4 p-md-5 bg-white shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h4 fw-bold mb-0">Cotización: <span th:text="${quote.quoteNumber}">RC-0001</span></h1>
                <a th:href="@{'/admin/cotizaciones/pdf/' + ${quote.id}}" class="btn btn-dark btn-sm rounded-pill px-3"><i class="bi bi-file-pdf me-2"></i>Descargar PDF</a>
            </div>

            <!-- Items Table -->
            <div class="table-responsive mb-4">
                <table class="table align-middle">
                    <thead>
                        <tr class="table-dark">
                            <th>Descripción</th>
                            <th class="text-center" style="width: 80px;">Cant.</th>
                            <th class="text-end" style="width: 150px;">Unitario</th>
                            <th class="text-end" style="width: 150px;">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${quote.items}">
                            <td th:text="${item.description}">Cámara</td>
                            <td th:text="${item.quantity}" class="text-center">1</td>
                            <td th:text="${'$' + #numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA')}" class="text-end">$0</td>
                            <td th:text="${'$' + #numbers.formatDecimal(item.total, 0, 'POINT', 0, 'COMMA')}" class="text-end">$0</td>
                        </tr>
                        <tr th:if="${quote.items == null || quote.items.isEmpty()}">
                            <td colspan="4" class="text-center text-secondary py-3">Pendiente por revisión y desglose técnico.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Totals -->
            <div class="row justify-content-end mb-4">
                <div class="col-md-5">
                    <div class="p-3 bg-light rounded-3">
                        <div class="d-flex justify-content-between mb-2 small">
                            <span>Subtotal:</span>
                            <strong th:text="${'$' + #numbers.formatDecimal(quote.subtotal, 0, 'POINT', 0, 'COMMA')}">$0</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2 small">
                            <span>IVA (19%):</span>
                            <strong th:text="${'$' + #numbers.formatDecimal(quote.taxAmount, 0, 'POINT', 0, 'COMMA')}">$0</strong>
                        </div>
                        <div class="d-flex justify-content-between border-top pt-2">
                            <span class="fw-bold">Total:</span>
                            <strong class="text-danger h5 mb-0" th:text="${'$' + #numbers.formatDecimal(quote.total, 0, 'POINT', 0, 'COMMA')}">$0</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Observations -->
            <div class="bg-light p-3 rounded-3 mb-4" th:if="${quote.adminObservations != null}">
                <strong class="small d-block mb-1">Observaciones del Ingeniero:</strong>
                <p class="small text-secondary mb-0" th:text="${quote.adminObservations}"></p>
            </div>
        </div>
    </div>
</body>
</html>
