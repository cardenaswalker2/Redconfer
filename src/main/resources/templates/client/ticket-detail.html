<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversación de Soporte - REDCONFER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body class="bg-light">

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold"><span style="color:#C61A22;">RED</span>CONFER Portal</span>
            <div class="ms-auto">
                <a href="/cliente/tickets" class="btn btn-outline-light btn-sm rounded-pill px-3">← Volver</a>
            </div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 800px;">
        <!-- Header Info -->
        <div class="card-premium p-4 bg-white shadow-sm mb-4">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-3 py-1 mb-2" th:text="${ticket.category}">Cámaras</span>
                    <h1 class="h5 fw-bold mb-1" th:text="${ticket.subject}">Asunto del Ticket</h1>
                    <span class="text-secondary small" th:text="${'Ticket N°: ' + ticket.ticketNumber}">TK-0001</span>
                </div>
                <span class="badge" th:classappend="${ticket.status.name() == 'OPEN' ? 'bg-success' : 'bg-secondary'}" th:text="${ticket.status}">ABIERTO</span>
            </div>
            <hr>
            <p class="small text-secondary mb-0" th:text="${ticket.description}">Descripción inicial.</p>
        </div>

        <!-- Chat History -->
        <div class="card-premium p-4 bg-white shadow-sm mb-4">
            <h3 class="h6 fw-bold mb-3">Mensajes y Respuestas</h3>
            
            <div class="chat-box" style="max-height: 400px; overflow-y: auto;">
                <div class="border-bottom py-2 mb-2" th:each="msg : ${ticket.messages}">
                    <div class="d-flex justify-content-between small">
                        <strong th:text="${msg.senderName}">Nombre</strong>
                        <span class="text-muted" th:text="${#temporals.format(msg.timestamp, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                    </div>
                    <p class="small mb-0 mt-1 text-secondary" th:text="${msg.message}">Contenido del mensaje...</p>
                </div>
                <div th:if="${ticket.messages == null || ticket.messages.isEmpty()}" class="text-center text-muted py-3 small">
                    No hay respuestas aún. Un técnico responderá en breve.
                </div>
            </div>
        </div>

        <!-- Reply Form -->
        <div class="card-premium p-4 bg-white shadow-sm" th:if="${ticket.status.name() != 'CLOSED'}">
            <form th:action="@{'/cliente/tickets/responder/' + ${ticket.id}}" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Escribir Respuesta</label>
                    <textarea name="message" class="form-control rounded-3" rows="3" placeholder="Escriba su mensaje aquí..." required></textarea>
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-primary rounded-pill px-4 shadow">Enviar Mensaje</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
