<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Ticket - REDCONFER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body class="bg-light">

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold"><span style="color:#C61A22;">RED</span>CONFER Portal</span>
            <div class="ms-auto">
                <a href="/cliente/tickets" class="btn btn-outline-light btn-sm rounded-pill px-3">← Volver</a>
            </div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 700px;">
        <div class="card-premium p-4 p-md-5 bg-white shadow-sm">
            <h1 class="h4 fw-bold mb-4">Nueva Solicitud de Soporte Técnico</h1>

            <form th:action="@{/cliente/tickets/guardar}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Asunto Principal</label>
                        <input type="text" name="subject" class="form-control rounded-3" placeholder="Ej: Pérdida de señal en cámara exterior" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Categoría del Equipo</label>
                        <select name="category" class="form-select rounded-3">
                            <option value="Cámaras de Seguridad">Cámaras de Seguridad</option>
                            <option value="Cableado y Redes">Cableado y Redes</option>
                            <option value="Controles de Acceso">Controles de Acceso</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label small fw-bold">Prioridad del Requerimiento</label>
                        <select name="priority" class="form-select rounded-3">
                            <option value="LOW">Baja (Consulta general / Preguntas)</option>
                            <option value="MEDIUM" selected>Media (Falla intermitente o menor)</option>
                            <option value="HIGH">Alta (Sistema inoperativo / Caída total)</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label small fw-bold">Descripción detallada del problema</label>
                        <textarea name="description" class="form-control rounded-3" rows="5" placeholder="Describa los síntomas del problema, códigos de error o fallas observadas..." required></textarea>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button type="submit" class="btn btn-primary rounded-pill px-4 shadow">Enviar Solicitud</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
