<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico - REDCONFER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body class="bg-light">

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold"><span style="color:#C61A22;">RED</span>CONFER Portal</span>
            <div class="ms-auto">
                <a href="/logout" class="btn btn-outline-light btn-sm rounded-pill px-3">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-md-3">
                <div class="card-premium p-3 bg-white shadow-sm">
                    <ul class="nav flex-column gap-2">
                        <li class="nav-item"><a class="nav-link text-dark" href="/cliente/dashboard"><i class="bi bi-house-door me-2"></i>Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active text-danger fw-bold" href="/cliente/tickets"><i class="bi bi-chat-left-text me-2"></i>Soporte Técnico</a></li>
                    </ul>
                </div>
            </div>

            <!-- Content -->
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 fw-bold mb-0">Mis Solicitudes de Soporte</h1>
                    <a href="/cliente/tickets/nuevo" class="btn btn-primary rounded-pill px-4 shadow-sm"><i class="bi bi-plus me-1"></i>Nuevo Ticket</a>
                </div>

                <div class="card-premium p-4 bg-white shadow-sm">
                    <div class="table-responsive">
                        <table class="table align-middle table-hover">
                            <thead>
                                <tr>
                                    <th>N° Ticket</th>
                                    <th>Asunto</th>
                                    <th>Categoría</th>
                                    <th>Prioridad</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${tickets}">
                                    <td th:text="${t.ticketNumber}" class="fw-bold">TK-0001</td>
                                    <td th:text="${t.subject}">Falla de visualización</td>
                                    <td th:text="${t.category}">Cámaras</td>
                                    <td>
                                        <span class="badge" th:classappend="${
                                            t.priority.name() == 'HIGH' || t.priority.name() == 'URGENT' ? 'bg-danger' :
                                            t.priority.name() == 'MEDIUM' ? 'bg-warning text-dark' : 'bg-secondary'
                                        }" th:text="${t.priority}">MEDIA</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${
                                            t.status.name() == 'OPEN' ? 'bg-success' :
                                            t.status.name() == 'RESOLVED' ? 'bg-secondary' : 'bg-dark'
                                        }" th:text="${t.status}">ABIERTO</span>
                                    </td>
                                    <td>
                                        <a th:href="@{'/cliente/tickets/ver/' + ${t.id}}" class="btn btn-sm btn-outline-dark rounded-pill px-3">Conversación</a>
                                    </td>
                                </tr>
                                <tr th:if="${tickets == null || tickets.isEmpty()}">
                                    <td colspan="6" class="text-center py-4 text-secondary">No tiene tickets de soporte abiertos.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
