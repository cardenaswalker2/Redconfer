<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Recibida - REDCONFER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-auto py-5 text-center" style="max-width: 600px;">
        <div class="card-premium p-5 bg-white shadow-sm">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            </div>
            <h1 class="h3 fw-bold mb-3">¡Solicitud Registrada!</h1>
            <p class="text-secondary mb-4" th:text="${successMessage}">Tu solicitud de cotización ha sido guardada en nuestra base de datos. Un ingeniero técnico revisará los datos e imágenes adjuntas.</p>
            <div class="d-grid gap-2 col-md-8 mx-auto">
                <a href="/" class="btn btn-outline-dark rounded-pill">Volver al Inicio</a>
            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
