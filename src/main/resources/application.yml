spring:
  application:
    name: redconfer
  data:
    mongodb:
      uri: ${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/redconfer}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: false # Disable caching for development
    prefix: classpath:/templates/
    suffix: .html

logging:
  level:
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO

server:
  port: 8080
